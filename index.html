<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbfaf9" />
  <title>Go Listen</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" class="app" aria-live="polite">
    <section id="promptScreen" class="screen prompt-screen" aria-label="Recording prompts">
      <div id="signatureTop" class="signature signature-top" aria-label="Show another set of prompts" role="button" tabindex="0"></div>
      <div id="promptList" class="prompt-list"></div>
      <div id="signatureBottom" class="signature signature-bottom" aria-hidden="true"></div>
    </section>

    <section id="successScreen" class="screen success-screen" hidden>
      <div class="success-copy">
        <p id="successLead" class="success-lead">Well done.</p>
        <p class="success-command">Go Listen!</p>
      </div>
      <div id="signatureSuccess" class="signature signature-bottom" aria-hidden="true"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
